      <h1>Vinay Pratap Singh</h1>
      <p>AI &amp; Cloud Architect | Agentic AI, Azure &amp; Enterprise Platforms</p>
      <p>AI and cloud architecture professional with 14 years of enterprise delivery experience. Designs Azure and GenAI solutions with evaluation, observability, and governance, while leading teams through architecture and delivery trade-offs. Combines hands-on engineering with AI enablement and technical leadership.</p>
      <h2>Selected work</h2>
      <h3>Invoice Intelligence &amp; Audit Automation</h3>
      <p>Multi-agent invoice and audit processing with SAP integration across two business units.</p>
      <h3>Procurement Intelligence Platform</h3>
      <p>RAG-based procurement intelligence for approximately 300 users across approximately 20,000 documents.</p>
      <h3>Connected Vehicle Platform</h3>
      <p>Continuous delivery, production stability, and support for a global ecosystem serving 20M+ vehicles and approximately 2M telemetry messages/minute.</p>
      <h2>Architecture showcase</h2>
      <h3>Agentic Knowledge &amp; Support Platform</h3>
      <p>A reusable support assistant pattern using Microsoft 365 Agents SDK, grounded retrieval, tool-driven workflows, and an Agent Governance Toolkit.</p>
      <h2>Experience</h2>
      <h3>Technical Lead / Architect - Microsoft India Private Ltd.</h3>
      <p>Dec 2021 – Present. Architecture and delivery across enterprise and government engagements in automotive, manufacturing, insurance, CPG, payroll, energy, and the public sector.</p>
      <h3>Technical Lead - SD Global Services</h3>
      <p>Jul 2020 – Dec 2021. Contributed to the architecture and development of an AI-assisted hiring platform within a 20-member engineering team.</p>
      <h3>Senior Analyst - Intersoft Data Labs</h3>
      <p>Jun 2012 – Jul 2020. Progressed from developer to senior analyst over eight years, delivering enterprise web and integration solutions across manufacturing, retail, and services.</p>
